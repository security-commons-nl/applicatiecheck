name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # De bron, de indeling en de afgeleiden.
  # normen wordt erbij uitgecheckt zodat de BIO2-kopie tegen de bron wordt gecontroleerd; hij gaat naar
  # _normen binnen de workspace, want een checkout buiten de workspace wordt geweigerd.
  bewijs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: security-commons-nl/normen
          path: _normen

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installeren
        run: python -m pip install --upgrade pip pytest

      - name: BIO2-kopie loopt gelijk met normen
        run: python tools/haal_normen.py --check

      - name: Tests
        run: python -m pytest tests/ -v
